name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache External Tools (FFmpeg, Pandoc)
        uses: actions/cache@v4
        with:
          path: tools
          key: vitarg-tools-${{ runner.os }}-v1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vitarg-Setup
          path: |
            dist/Vitarg-Setup.exe
          if-no-files-found: warn

      - name: Delete old release if exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "${{ github.ref_name }}"
          try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers -Method Get
              if ($rel.id) {
                  Write-Host "Deleting old release ID: $($rel.id)"
                  Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($rel.id)" -Headers $headers -Method Delete
                  Write-Host "Old release deleted successfully."
              }
          } catch {
              Write-Host "No previous release found: $_"
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vitarg ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/Vitarg-Setup.exe
