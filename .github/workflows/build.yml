name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache External Tools (FFmpeg, Pandoc)
        uses: actions/cache@v4
        with:
          path: tools
          key: vitarg-tools-${{ runner.os }}-v1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vitarg-Setup
          path: |
            dist/Vitarg-Setup.exe
            dist/Vitarg-app.zip
            dist/manifest.json
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pandoc \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pillow pillow_heif py7zr python-docx pymupdf pyinstaller requests

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            python -m unittest discover -s tests -p "test_*.py"
          else
            echo "No tests directory found, skipping."
          fi

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name Vitarg \
            --add-data "assets:assets" \
            --collect-all pillow_heif --collect-all py7zr --collect-all fitz --collect-all pymupdf \
            run_vitarg.py

      - name: Verify Startup (Offscreen Selftest)
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/Vitarg/Vitarg --selftest
          cat /tmp/vitarg-selftest.txt

      - name: Package Linux Distribution
        run: |
          tar -czvf dist/Vitarg-linux-x86_64.tar.gz -C dist Vitarg

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vitarg-linux-x86_64
          path: dist/Vitarg-linux-x86_64.tar.gz
          if-no-files-found: warn

  release:
    needs: [build-windows, build-linux]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !contains(needs.*.result, 'cancelled') && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vitarg-Setup
          path: dist
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: Vitarg-linux-x86_64
          path: dist
        continue-on-error: true

      - name: Delete old release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -n "$REL_ID" ]; then
            echo "Deleting old release ID: $REL_ID"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vitarg ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/Vitarg-Setup.exe
            dist/Vitarg-app.zip
            dist/manifest.json
            dist/Vitarg-linux-x86_64.tar.gz
